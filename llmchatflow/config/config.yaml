user_mode: "single"
session_id_default: "default_session"
query_rewrite_trigger: "none"
query_rewrite_persist: "none"
embedding_input_source: "original"
embedding_dimension: 384
faiss_topk: 20
faiss_filter_strategy: "global"
ranking_score_normalize: true
ranking_weight_mode: "by_memory_type"
ranking_type_weights_episodic: {"alpha": 0.5, "beta": 0.1, "theta": 0.4}
ranking_type_weights_habit: {"alpha": 0.7, "beta": 0.3, "theta": 0.0}
ranking_type_weights_summary: {"alpha": 0.6, "beta": 0.3, "theta": 0.1}
ranking_type_weights_default: {"alpha": 0.5, "beta": 0.2, "theta": 0.3}
ranking_keep_count: 10
context_max_token: 2000
context_min_token: 500
history_summarize: true
system_prompt: "built-in"
memory_type_llm_judge: true
faiss_write_strategy: "real_time"
importance_llm_judge: true
importance_default: 0.5
archive_days: 90
archive_importance: 0.2
