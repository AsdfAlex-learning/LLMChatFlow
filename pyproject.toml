[project]
name = "llmchatflow"
version = "0.1.0"
description = "A sophisticated workflow engine for LLM-based chatbots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.8.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "torch>=2.0.0",
    "huggingface-hub>=0.20.0",
    "accelerate>=0.20.0",
    "pysqlite3-binary; platform_system == 'Linux'",
    "pysqlite3; platform_system != 'Linux'",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "black", "isort"]
storage-postgres = ["psycopg[binary]", "pgvector"]
storage-mysql = ["pymysql"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "--cov=llmchatflow --cov-report=term-missing --cov-fail-under=50"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
